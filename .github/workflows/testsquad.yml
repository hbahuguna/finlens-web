name: TestSquad Autonomous QA

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM Model to use'
        required: true
        default: 'deepseek/deepseek-chat'
        type: choice
        options:
          - 'deepseek/deepseek-chat'
          - 'claude-3-5-sonnet-latest'
          - 'gpt-4'
      pr_url:
        description: 'PR URL (for manual verification)'
        required: false
        default: 'https://github.com/hbahuguna/finlens-web/pull/1'
        type: string
      base_sha:
        description: 'Base SHA'
        required: false
        type: string
      head_sha:
        description: 'Head SHA'
        required: false
        type: string

jobs:
  testsquad-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Product Repo
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0

      - name: Checkout Automation Repo
        uses: actions/checkout@v4
        with:
          repository: hbahuguna/finlens-qa
          path: automation
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Debug - List Files
        run: |
          echo "Listing product repo:"
          ls -R product | head -n 20
          echo "Listing automation repo:"
          ls -R automation | head -n 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install TestSquad
        run: |
          pip install "testsquad[full] @ git+https://x-access-token:${{ secrets.GH_PAT }}@github.com/hbahuguna/testsquad.git"

      - name: Configure Git for Automation Repo
        working-directory: automation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Ensure origin uses PAT for push
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/hbahuguna/finlens-qa.git

      - name: Run TestSquad
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_MODEL: ${{ github.event.inputs.model || 'deepseek/deepseek-chat' }}
          TESTSQUAD_ALLOW_PR_CREATION: true
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Current working directory: $(pwd)"
          echo "Listing directories relative to PWD:"
          ls -F
          testsquad run-pr \
            --pr-url "${{ github.event.pull_request.html_url || github.event.inputs.pr_url }}" \
            --product-repo ./product \
            --automation-repo ./automation \
            --use-real-fs \
            --use-real-git \
            --use-tools \
            --base-sha ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || '6f5cc3e77c4d565a507ae5236b0df22fd347ca4c' }} \
            --head-sha ${{ github.event.pull_request.head.sha || github.event.inputs.head_sha || github.sha }} \
            --output-dir reports \
            --report-name testsquad-report.json

      - name: Upload TestSquad Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsquad-report
          path: reports/testsquad-report.json
